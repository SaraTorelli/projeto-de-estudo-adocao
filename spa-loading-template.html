<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fdfaf4;
        font-family: Georgia, serif;
        color: #5f3722;
      }
      .abertura { text-align: center; }
      .abertura .pata { font-size: 42px; animation: salto 1s ease-in-out infinite; display: inline-block; }
      .abertura p { font-style: italic; letter-spacing: .02em; margin-top: 10px; }
      @keyframes salto {
        0%, 100% { transform: translateY(0) rotate(-6deg); }
        50% { transform: translateY(-10px) rotate(6deg); }
      }
    </style>
  </head>
  <body>
    <div class="abertura">
      <span class="pata">🐾</span>
      <p>Au au... preparando as patinhas...</p>
    </div>
  </body>
</html>
